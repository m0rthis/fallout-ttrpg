# Public release: build the system and attach it to a GitHub Release.
#
# This is the whole publishing story for the public repository. Foundry's
# "Install System > Manifest URL" flow needs one stable URL serving the latest
# system.json, whose `download` points at that version's zip — GitHub's
# `releases/latest/download/<asset>` redirect provides exactly that, so nothing
# here needs configuring: no secrets, no variables, no hosts to name.
#
#   Manifest URL:  https://github.com/<owner>/<repo>/releases/latest/download/system.json
#
# Tag a commit `vX.Y.Z` and push the tag; everything else follows.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify

      # The version becomes the tag so Foundry shows real release versions, and
      # `download` is pinned to this tag's zip so the manifest a world checks
      # always resolves to the build it describes rather than a moving target.
      # `manifest` stays on the /latest/ redirect, which is what makes update
      # checking work.
      - name: Stamp the manifest
        env:
          TAG: ${{ github.ref_name }}
          RELEASES: ${{ github.server_url }}/${{ github.repository }}/releases
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('dist/system.json', 'utf8'));
            m.version = process.env.TAG.replace(/^v/, '');
            m.url = '${{ github.server_url }}/${{ github.repository }}';
            m.bugs = m.url + '/issues';
            m.manifest = process.env.RELEASES + '/latest/download/system.json';
            m.download = process.env.RELEASES + '/download/' + process.env.TAG + '/fallout-ttrpg-system.zip';
            fs.writeFileSync('dist/system.json', JSON.stringify(m, null, 2) + '\n');
            console.log('stamped', m.version, '->', m.download);
          "

      - name: Package
        run: cd dist && zip -qr ../fallout-ttrpg-system.zip .

      # system.json is attached alongside the zip, not just inside it: the
      # manifest URL has to be fetchable on its own for Foundry to install from
      # it or check it for updates.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "See [CHANGELOG.md](CHANGELOG.md)." \
            fallout-ttrpg-system.zip dist/system.json
